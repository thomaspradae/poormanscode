[pmc]
db_path = "~/.local/share/poormans-code/pmc.db"
runs_dir = "~/.local/share/poormans-code/runs"
worktrees_dir = "~/.local/share/poormans-code/worktrees"
exploration_rate = 0.20
min_samples_per_candidate = 5
max_attempts = 3
same_candidate_retries = 2
review_enabled = false
lease_ttl_seconds = 300
verifier_sandbox = "bwrap"
require_model_conformance = true
router_policy = "contextual_thompson"
contextual_min_observations = 50
bandit_simulations = 256

[[providers.groq.credentials]]
id = "groq-1"
api_key_env = "GROQ_API_KEY"
quota_scope_confidence = "UNKNOWN"

[[providers.gemini.credentials]]
id = "gemini-1"
api_key_env = "GEMINI_API_KEY"
quota_scope_confidence = "UNKNOWN"

[[providers.jules.credentials]]
id = "jules-1"
api_key_env = "JULES_API_KEY"
quota_scope_confidence = "UNKNOWN"

[research]
enabled = false
model = "gemini-3-flash-preview"
api_key_env = "GEMINI_API_KEY"
max_queries_per_attempt = 5

[toolchains.unity]
# Set after installing an Editor; PMC probes this exact executable.
editor_path = "/opt/unity/Editor/Unity"
version = "6000.0"

# Verification placement is independent of the authoring executor. A Jules or
# OpenHands patch for a Node repository is still verified on this Node worker.
[toolchains.node]
verifier_sandbox = "remote-lxd"
resource_class = "ofi1-lxd-node24"
remote_host = "uace-ofi-01"
remote_instance = "pmc-node-worker"
remote_seed_node_modules = "/opt/pmc-node-cache/garage-v2/node_modules"

# Candidate examples. Enable only resources you actually have.

[[candidates]]
name = "groq-oss20-bash"
version = "5"
provider = "groq"
enabled = true
executor = "bash"
role = "builder"
model = "openai/gpt-oss-20b"
base_url = "https://api.groq.com/openai/v1"
quota_group = "groq"
max_turns = 20
sandbox = "bwrap"
network = false
capabilities = ["python", "node", "npm"] # declare remote/special capabilities explicitly
request_extra = { parallel_tool_calls = false, reasoning_effort = "low" }
tool_protocol_retries = 2

# Example of a credential-free remote toolchain worker. The controller makes
# model requests locally; only shell commands cross SSH into the no-network LXD
# container. Use a shared resource_group to prevent concurrent jobs from
# colliding in a single worker instance.
[[candidates]]
name = "groq-oss120-ofi1-node"
version = "3"
provider = "groq"
enabled = false
executor = "bash"
role = "builder"
model = "openai/gpt-oss-120b"
base_url = "https://api.groq.com/openai/v1"
max_turns = 30
max_tokens = 1200
context_limit = 10000
observation_chars = 3000
sandbox = "remote-lxd"
network = false
resource_class = "ofi1-lxd-node24"
resource_group = "ofi1-lxd-node"
resource_concurrency = 1
capabilities = ["node", "npm", "scaffolder:create-next-app"]
remote_host = "uace-ofi-01"
remote_instance = "pmc-node-worker"
remote_seed_node_modules = "/opt/pmc-node-cache/garage/node_modules"
verifier_sandbox = "remote-lxd"
command_timeout = 600
memory_mb = 4096
workspace_mb = 4096
workspace_files = 100000
request_extra = { parallel_tool_calls = false, reasoning_effort = "low" }
tool_protocol_retries = 2

[[candidates]]
name = "nvidia-nemotron-super-ofi1-node"
version = "1"
provider = "nvidia"
enabled = false
executor = "bash"
role = "builder"
model = "nvidia/nemotron-3-super-120b-a12b"
base_url = "https://integrate.api.nvidia.com/v1"
max_turns = 30
sandbox = "remote-lxd"
network = false
resource_class = "ofi1-lxd-node24"
resource_group = "ofi1-lxd-node"
resource_concurrency = 1
capabilities = ["node", "npm", "scaffolder:create-next-app"]
remote_host = "uace-ofi-01"
remote_instance = "pmc-node-worker"
remote_seed_node_modules = "/opt/pmc-node-cache/garage/node_modules"
verifier_sandbox = "remote-lxd"
command_timeout = 600
memory_mb = 4096
workspace_mb = 4096
workspace_files = 100000

[[candidates]]
name = "gemini-flash-bash"
enabled = false
executor = "bash"
role = "builder"
model = "gemini-3-flash-preview"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
quota_group = "gemini"
max_turns = 20
sandbox = "bwrap"
network = false

