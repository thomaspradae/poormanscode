[pmc]
db_path = "~/.local/share/poormans-code/pmc.db"
runs_dir = "~/.local/share/poormans-code/runs"
worktrees_dir = "~/.local/share/poormans-code/worktrees"
exploration_rate = 0.20
min_samples_per_candidate = 5
max_attempts = 3
same_candidate_retries = 2
review_enabled = false
lease_ttl_seconds = 300
verifier_sandbox = "restricted-user"
require_model_conformance = true
router_policy = "contextual_thompson"
contextual_min_observations = 50
bandit_simulations = 256

# Credentials are quota lanes beneath candidates. Only environment-variable
# names are configured here; secret values stay in secrets.env.
[[providers.groq.credentials]]
id = "groq-1"
api_key_env = "GROQ_API_KEY"
quota_scope_confidence = "UNKNOWN"

[[providers.gemini.credentials]]
id = "gemini-1"
api_key_env = "GEMINI_API_KEY"
quota_scope_confidence = "UNKNOWN"

[[providers.jules.credentials]]
id = "jules-1"
api_key_env = "JULES_API_KEY"
quota_scope_confidence = "UNKNOWN"

[research]
enabled = false
model = "gemini-3-flash-preview"
api_key_env = "GEMINI_API_KEY"
max_queries_per_attempt = 5

[toolchains.unity]
# Set this to the exact executable installed by Unity Hub.
editor_path = "/home/YOU/Unity/Hub/Editor/6000.x/Editor/Unity"
version = "6000.x"

# Optional controller-owned placement for Node verification. Repository files
# name the toolchain but cannot choose the machine or weaken its sandbox.
# [toolchains.node]
# verifier_sandbox = "remote-lxd"
# resource_class = "ofi1-lxd-node24"
# remote_host = "uace-ofi-01"
# remote_instance = "pmc-node-worker"
# remote_seed_node_modules = "/opt/pmc-node-cache/garage-v2/node_modules"

# Candidate examples. Enable only resources you actually have.

[[candidates]]
name = "groq-oss20-bash"
version = "5"
provider = "groq"
enabled = true
executor = "bash"
role = "builder"
model = "openai/gpt-oss-20b"
base_url = "https://api.groq.com/openai/v1"
quota_group = "groq"
max_turns = 20
sandbox = "bwrap"
network = false
request_extra = { parallel_tool_calls = false, reasoning_effort = "low" }
tool_protocol_retries = 2

[[candidates]]
name = "gemini-flash-bash"
enabled = false
executor = "bash"
role = "builder"
model = "gemini-3-flash-preview"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
quota_group = "gemini"
max_turns = 20
sandbox = "bwrap"
network = false

[[candidates]]
name = "local-qwen-bash"
enabled = false
executor = "bash"
role = "builder"
model = "qwen2.5-coder:7b"
base_url = "http://127.0.0.1:11434/v1"
api_key_env = ""
quota_group = "local"
resource_group = "local-cpu-1"
resource_concurrency = 1
max_turns = 25
sandbox = "bwrap"
network = false

[[candidates]]
name = "groq-oss20-openhands"
enabled = false
executor = "openhands"
role = "builder"
model = "openai/gpt-oss-20b"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
quota_group = "groq"
resource_group = "openhands-host-1"
resource_concurrency = 1
max_turns = 50
complexities = ["STANDARD", "DIFFICULT"]
task_types = ["FEATURE", "ARCHITECTURAL", "DEPENDENCY_API", "INTEGRATION", "UI", "BUG_FIX"]
# server_url = "http://100.x.y.z:8000"   # optional OpenHands Agent Server over Tailscale

[[candidates]]
name = "jules"
version = "2"
provider = "jules"
enabled = false
executor = "jules"
role = "builder"
# "auto" derives sources/github/OWNER/REPO from each job repository's origin.
# Pin an explicit Jules source only for unusual deployments.
source = "auto"
quota_group = "jules"
exploration = false
first_attempt_only = false
task_types = ["FEATURE", "ARCHITECTURAL", "DEPENDENCY_API"]
quota_attempts = 15
quota_window_seconds = 86400
max_concurrency = 3

# Optional independent reviewer. It is deliberately another candidate so
# authors do not review themselves when alternatives exist.
[[candidates]]
name = "gemini-reviewer"
provider = "gemini"
enabled = false
executor = "bash"
role = "reviewer"
model = "gemini-3-flash-preview"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
quota_group = "gemini"
max_turns = 8
sandbox = "bwrap"
network = false

[[candidates]]
name = "gemini-planner"
provider = "gemini"
enabled = false
executor = "bash"
role = "planner"
model = "gemini-3-flash-preview"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
max_turns = 4
sandbox = "bwrap"
network = false

[[candidates]]
name = "groq-challenger"
provider = "groq"
enabled = false
executor = "bash"
role = "challenger"
model = "openai/gpt-oss-20b"
base_url = "https://api.groq.com/openai/v1"
max_turns = 4
sandbox = "bwrap"
network = false
