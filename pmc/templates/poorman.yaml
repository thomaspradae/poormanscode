setup: null

# Optional native toolchain profile, for example: unity
toolchain: null

# Unity profile gates. The Editor path/version live in global config.toml.
unity:
  # Resident-memory control. Unity/CoreCLR needs unlimited virtual reservations.
  memory_mb: 6144
  # Unity's build pipeline preallocates sparse files; 0 disables RLIMIT_FSIZE.
  # Aggregate workspace bytes/files remain continuously enforced by PMC.
  max_single_file_mb: 0
  process_limit: 512
  # Licensing runs in a trusted controller service exposed through IPC only.
  # Keep project-code verification network-isolated.
  network_for_license: false
  # Enable after adding com.unity.test-framework and an EditMode test assembly.
  editmode_tests: false
  playmode_tests: false

test: "pytest -q"
lint: null
typecheck: null
build: null

# Controller-only test. This command is never included in the builder prompt.
hidden_test: null

timeout_seconds: 600
max_patch_lines: 500
max_files_changed: 10
no_new_dependencies: false

protected:
  - ".git/**"
  - ".github/workflows/**"
  - "secrets/**"
  - ".env"

# Optional dependency manifests to protect when no_new_dependencies=true.
dependency_files:
  - "pyproject.toml"
  - "requirements.txt"
  - "package.json"
  - "package-lock.json"
  - "pnpm-lock.yaml"
  - "yarn.lock"

# Additional untracked artifacts to exclude from acceptance diffs.
verification_ignore: []
